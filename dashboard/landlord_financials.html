<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landlord Financials</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <style>
        body {
            background: transparent;
            color: #fff;
            padding: 1.5rem;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            height: 100%;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .trend-up {
            color: #34d399;
        }

        .trend-down {
            color: #f87171;
        }

        .apexcharts-tooltip {
            background: rgba(30, 41, 59, 0.9) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1) !important;
        }

        .apexcharts-tooltip-title {
            background: transparent !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
    </style>
</head>

<body>
    <div class="container-fluid px-0">
        <h4 class="mb-4">Financial Overview</h4>
        <div class="row g-4 mb-4">
            <div class="col-12 col-md-4">
                <div class="glass-card">
                    <div class="text-white-50 mb-2">Total Income (YTD)</div>
                    <div class="stat-value mb-2">$84,500</div>
                    <div class="small trend-up"><span
                            class="material-symbols-outlined align-middle fs-6">trending_up</span> +12.5% vs last year
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="glass-card">
                    <div class="text-white-50 mb-2">Total Expenses (YTD)</div>
                    <div class="stat-value mb-2">$18,200</div>
                    <div class="small trend-up"><span
                            class="material-symbols-outlined align-middle fs-6">trending_down</span> -5.2% vs last year
                    </div>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="glass-card">
                    <div class="text-white-50 mb-2">Net Profit</div>
                    <div class="stat-value mb-2">$66,300</div>
                    <div class="small trend-up"><span
                            class="material-symbols-outlined align-middle fs-6">trending_up</span> +18.4% vs last year
                    </div>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <div class="col-12 col-lg-8">
                <div class="glass-card">
                    <h5 class="mb-4">Income vs Expenses</h5>
                    <div id="cashflowChart"></div>
                </div>
            </div>
            <div class="col-12 col-lg-4">
                <div class="glass-card">
                    <h5 class="mb-4">Expense Breakdown</h5>
                    <div id="expenseChart"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script> // Cashflow Chart const cashflowOptions = { series: [{ name: 'Income', data: [12500, 12500, 13200, 13200, 14500, 14500, 14100] }, { name: 'Expenses', data: [2100, 1800, 3500, 1900, 2400, 1500, 5000] }], chart: { type: 'area', height: 350, toolbar: { show: false }, background: 'transparent', foreColor: '#a1a1aa' }, theme: { mode: 'dark' }, colors: ['#3b82f6', '#ef4444'], fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.4, opacityTo: 0.05, stops: [0, 100] } }, dataLabels: { enabled: false }, stroke: { curve: 'smooth', width: 2 }, xaxis: { categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul'], axisBorder: { show: false }, axisTicks: { show: false } }, yaxis: { labels: { formatter: (value) =>"$" + value } }, grid: { borderColor: 'rgba(255,255,255,0.1)', strokeDashArray: 4 } }; const cashflowChart = new ApexCharts(document.querySelector("#cashflowChart"), cashflowOptions); cashflowChart.render(); // Expense Chart const expenseOptions = { series: [45, 25, 20, 10], chart: { type: 'donut', height: 350, background: 'transparent', foreColor: '#a1a1aa' }, theme: { mode: 'dark' }, labels: ['Maintenance', 'Property Tax', 'Insurance', 'Utilities'], colors: ['#3b82f6', '#8b5cf6', '#10b981', '#f59e0b'], plotOptions: { pie: { donut: { size: '70%', background: 'transparent' } } }, dataLabels: { enabled: false }, stroke: { show: false }, legend: { position: 'bottom' } }; const expenseChart = new ApexCharts(document.querySelector("#expenseChart"), expenseOptions); expenseChart.render(); </script>
</body>

</html>
