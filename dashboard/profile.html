<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="../css/style.css" rel="stylesheet" />
    <style>
        body {
            background-color: transparent;
            color: #ffffff;
            padding: 1.5rem;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        /* Glassmorphism Classes */
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 2rem;
        }

        .avatar-upload {
            position: relative;
            width: 120px;
            height: 120px;
            margin-bottom: 1.5rem;
        }

        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            color: white;
            box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4);
            border: 4px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .avatar-edit {
            position: absolute;
            right: 0;
            bottom: 0;
            z-index: 1;
        }

        .avatar-edit input {
            display: none;
        }

        .avatar-edit label {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background-color: var(--primary-color);
            border-radius: 50%;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            border: 2px solid #0f172a;
            transition: all 0.2s;
        }

        .avatar-edit label:hover {
            transform: scale(1.1);
            background-color: #ffffff;
            color: var(--primary-color);
        }

        .form-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .form-control {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 0.8rem 1rem;
        }

        .form-control:focus {
            background: rgba(15, 23, 42, 0.8);
            border-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 0 0 0.25rem rgba(6, 182, 212, 0.25);
        }

        .form-control:disabled,
        .form-control[readonly] {
            background: rgba(0, 0, 0, 0.2);
            opacity: 0.6;
        }
    </style>
</head>

<body>
    <div class="container-fluid px-0">
        <div class="d-flex align-items-center mb-4 gap-3"> <span class="material-symbols-outlined fs-2 text-primary"
                style="font-variation-settings: 'FILL' 1;">account_circle</span>
            <h2 class="fw-bold mb-0" style="font-family: 'Montserrat', sans-serif;">My Profile</h2>
        </div>
        <div class="row g-4"> <!-- Left Column: Personal Info -->
            <div class="col-12 col-xl-8">
                <div class="glass-card mb-4">
                    <h5 class="fw-bold mb-4 border-bottom border-secondary border-opacity-25 pb-3">Personal Information
                    </h5>
                    <div
                        class="d-flex flex-column flex-sm-row gap-4 mb-4 align-items-sm-center border-bottom border-secondary border-opacity-25 pb-4">
                        <div class="avatar-upload">
                            <div class="avatar-edit"> <input type='file' id="imageUpload" accept=".png, .jpg, .jpeg" />
                                <label for="imageUpload"><span
                                        class="material-symbols-outlined fs-5">edit</span></label> </div>
                            <div class="avatar-preview" id="profileAvatar">U</div>
                        </div>
                        <div>
                            <h4 class="fw-bold mb-1" id="profileNameDisplay">User Name</h4>
                            <p class="text-light opacity-75 mb-2" id="profileEmailDisplay">user@example.com</p> <span
                                class="badge bg-primary bg-opacity-25 text-primary border border-primary fw-bold letter-spacing-1 rounded-pill px-3"
                                id="profileRoleDisplay">ROLE</span>
                        </div>
                    </div>
                    <form>
                        <div class="row g-4 mb-4">
                            <div class="col-md-6"> <label class="form-label">Full Name</label> <input type="text"
                                    class="form-control rounded-3" value="User Name" id="inputName"> </div>
                            <div class="col-md-6"> <label class="form-label">Email Address</label> <input type="email"
                                    class="form-control rounded-3" value="user@example.com" id="inputEmail" readonly>
                            </div>
                            <div class="col-md-6"> <label class="form-label">Phone Number</label> <input type="tel"
                                    class="form-control rounded-3" placeholder="+1 (555) 000-0000"> </div>
                            <div class="col-md-6"> <label class="form-label">Location</label> <input type="text"
                                    class="form-control rounded-3" placeholder="City, State"> </div>
                            <div class="col-12"> <label class="form-label">Bio / About Me</label> <textarea
                                    class="form-control rounded-3" rows="4"
                                    placeholder="Tell landlords or tenants a little bit about yourself..."></textarea>
                            </div>
                        </div>
                        <div class="text-end"> <button onclick="window.top.location.href='../404.html'" type="button"
                                class="btn btn-custom fw-bold px-4 py-2 rounded-pill shadow-cyan"
                                style="background: var(--primary-color); border: none;">Save Changes</button> </div>
                    </form>
                </div>
            </div> <!-- Right Column: Security & Settings -->
            <div class="col-12 col-xl-4">
                <div class="glass-card mb-4">
                    <h5 class="fw-bold mb-4 border-bottom border-secondary border-opacity-25 pb-3">Security</h5>
                    <form>
                        <div class="mb-3"> <label class="form-label">Current Password</label> <input type="password"
                                class="form-control rounded-3" placeholder="Enter current password"> </div>
                        <div class="mb-3"> <label class="form-label">New Password</label> <input type="password"
                                class="form-control rounded-3" placeholder="Enter new password"> </div>
                        <div class="mb-4"> <label class="form-label">Confirm New Password</label> <input type="password"
                                class="form-control rounded-3" placeholder="Confirm new password"> </div> <button onclick="window.top.location.href='../404.html'"
                            type="button" class="btn btn-custom-secondary w-100 fw-bold rounded-pill">Update
                            Password</button>
                    </form>
                </div>
                <div class="glass-card bg-danger bg-opacity-10 border-danger border-opacity-25">
                    <h5 class="fw-bold text-danger mb-3">Danger Zone</h5>
                    <p class="small text-light opacity-75 mb-3">Once you delete your account, there is no going back.
                        Please be certain.</p> <button onclick="window.top.location.href='../404.html'"
                        class="btn btn-danger w-100 fw-bold rounded-pill shadow-sm">Delete Account</button>
                </div>
            </div>
        </div>
    </div>
    <script> // Sync with dashboard JS localstorage document.addEventListener('DOMContentLoaded', () => { const user = JSON.parse(localStorage.getItem('loggedInUser')); if(user) { document.getElementById('profileNameDisplay').textContent = user.name; document.getElementById('inputName').value = user.name; document.getElementById('profileEmailDisplay').textContent = user.email; document.getElementById('inputEmail').value = user.email; document.getElementById('profileRoleDisplay').textContent = user.role; document.getElementById('profileAvatar').textContent = user.name.charAt(0).toUpperCase(); } }); </script>
</body>

</html>
