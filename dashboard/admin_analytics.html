<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Analytics</title> <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="../css/style.css" rel="stylesheet">
    <style>
        body {
            background: transparent;
            color: #fff;
            padding: 20px;
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 24px;
            margin-bottom: 24px;
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #4ade80;
        }
    </style>
</head>

<body>
    <div class="container-fluid px-0">
        <div class="row g-4 mb-4">
            <div class="col-12 col-md-4">
                <div class="glass-card text-center h-100"> <span
                        class="material-symbols-outlined stat-icon text-primary">groups</span>
                    <h3 class="fw-bold mb-1">12,450</h3>
                    <p class="text-white-50 mb-0">Total Users</p> <small class="text-success"><span
                            class="material-symbols-outlined fs-6 align-middle">trending_up</span> +14.5% this
                        month</small>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="glass-card text-center h-100"> <span
                        class="material-symbols-outlined stat-icon text-warning">real_estate_agent</span>
                    <h3 class="fw-bold mb-1">3,892</h3>
                    <p class="text-white-50 mb-0">Active Listings</p> <small class="text-success"><span
                            class="material-symbols-outlined fs-6 align-middle">trending_up</span> +5.2% this
                        month</small>
                </div>
            </div>
            <div class="col-12 col-md-4">
                <div class="glass-card text-center h-100"> <span
                        class="material-symbols-outlined stat-icon text-success">payments</span>
                    <h3 class="fw-bold mb-1">$452K</h3>
                    <p class="text-white-50 mb-0">Monthly Revenue</p> <small class="text-success"><span
                            class="material-symbols-outlined fs-6 align-middle">trending_up</span> +22.1% this
                        month</small>
                </div>
            </div>
        </div>
        <div class="row g-4">
            <div class="col-12 col-lg-8">
                <div class="glass-card h-100">
                    <h5 class="mb-4 fw-bold">Revenue Overview</h5>
                    <div id="revenueChart"></div>
                </div>
            </div>
            <div class="col-12 col-lg-4">
                <div class="glass-card h-100">
                    <h5 class="mb-4 fw-bold">User Demographics</h5>
                    <div id="usersChart"></div>
                </div>
            </div>
        </div>
    </div> <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script> // Revenue Chart var revenueOptions = { series: [{ name: 'Revenue', data: [31000, 40000, 28000, 51000, 42000, 109000, 100000, 120000] }], chart: { height: 350, type: 'area', background: 'transparent', toolbar: { show: false } }, theme: { mode: 'dark' }, colors: ['#3b82f6'], fill: { type: 'gradient', gradient: { shadeIntensity: 1, opacityFrom: 0.7, opacityTo: 0.2, stops: [0, 90, 100] } }, dataLabels: { enabled: false }, stroke: { curve: 'smooth', width: 2 }, xaxis: { categories: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'], axisBorder: { show: false }, axisTicks: { show: false } }, yaxis: { labels: { formatter: function (val) { return"$" + (val / 1000) +"K" } } }, grid: { borderColor: 'rgba(255,255,255,0.1)', strokeDashArray: 4, } }; var revenueChart = new ApexCharts(document.querySelector("#revenueChart"), revenueOptions); revenueChart.render(); // Users Chart var usersOptions = { series: [65, 35], chart: { height: 350, type: 'donut', background: 'transparent' }, theme: { mode: 'dark' }, labels: ['Tenants', 'Landlords'], colors: ['#8b5cf6', '#ec4899'], stroke: { show: false }, dataLabels: { enabled: true }, legend: { position: 'bottom' }, plotOptions: { pie: { donut: { size: '70%', background: 'transparent' } } } }; var usersChart = new ApexCharts(document.querySelector("#usersChart"), usersOptions); usersChart.render();
    </script>
</body>

</html>
