<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Page Not Found | Stackly</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="css/style.css" rel="stylesheet" />
    
    <style>
        body, html {
            height: 100%;
            margin: 0;
            overflow: hidden; /* Prevent scrolling on 404 page */
            background-color: #020617; /* Very dark slate */
            font-family: 'Inter', sans-serif;
        }

        /* Animated Gradient Background */
        .bg-gradient-anim {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(6, 182, 212, 0.15) 0%, rgba(2, 6, 23, 1) 70%);
            z-index: 0;
            animation: pulseGlow 8s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        #tsparticles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            top: 0;
            left: 0;
        }

        /* 404 Content Container */
        .error-container {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .glass-error-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 4rem 2rem;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(6, 182, 212, 0.1);
            max-width: 600px;
            width: 100%;
            animation: floatCard 6s ease-in-out infinite;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .error-code {
            font-family: 'Montserrat', sans-serif;
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 0;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(6, 182, 212, 0.3);
            position: relative;
        }

        /* Glitch effect on hover */
        .error-code:hover {
            animation: glitch 0.3s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }

        .error-message {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-top: 1rem;
            margin-bottom: 1rem;
        }

        .error-desc {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2.5rem;
            font-size: 1.1rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 320px Responsiveness */
        @media (max-width: 480px) {
            .error-code {
                font-size: 6rem;
            }
            .glass-error-card {
                padding: 3rem 1.5rem;
            }
            .error-message {
                font-size: 1.25rem;
            }
            .error-desc {
                font-size: 0.95rem;
                margin-bottom: 2rem;
            }
            .btn-group-custom {
                flex-direction: column;
                gap: 15px;
            }
            .btn-group-custom .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- Background Elements -->
    <div class="bg-gradient-anim"></div>
    <div id="tsparticles"></div>

    <!-- Main Content -->
    <div class="error-container">
        <div class="glass-error-card">
            
            <div class="mb-3">
                <i class="fa-solid fa-satellite-dish text-primary opacity-50" style="font-size: 3rem;"></i>
            </div>
            
            <h1 class="error-code">404</h1>
            <h3 class="error-message">Lost in Space</h3>
            <p class="error-desc">We can't seem to find the page you're looking for. The link might be broken or the page may have been removed.</p>
            
            <div class="d-flex justify-content-center gap-3 btn-group-custom">
                <button onclick="history.back()" class="btn btn-custom-secondary rounded-pill px-4 py-2 d-flex align-items-center justify-content-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i> Go Back
                </button>
                <a href="index.html" class="btn btn-custom rounded-pill px-4 py-2 d-flex align-items-center justify-content-center gap-2">
                    <i class="fa-solid fa-house"></i> Back to Home
                </a>
            </div>
            
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-preset-stars@2/tsparticles.preset.stars.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Initialize tsParticles with stars preset
            tsParticles.load("tsparticles", {
                preset: "stars",
                background: {
                    color: {
                        value: "transparent"
                    }
                },
                particles: {
                    number: {
                        value: 120,
                        density: { enable: true, value_area: 800 }
                    },
                    color: { value: ["#06b6d4", "#8b5cf6", "#ffffff"] },
                    opacity: {
                        value: 0.6,
                        random: true,
                        anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false }
                    },
                    size: {
                        value: 3,
                        random: true,
                        anim: { enable: true, speed: 2, size_min: 0.3, sync: false }
                    },
                    line_linked: { enable: false },
                    move: {
                        enable: true,
                        speed: 0.5,
                        direction: "none",
                        random: true,
                        straight: false,
                        out_mode: "out",
                        bounce: false,
                    }
                },
                interactivity: {
                    detect_on: "canvas",
                    events: {
                        onhover: { enable: true, mode: "repulse" },
                        onclick: { enable: true, mode: "push" },
                        resize: true
                    }
                },
                retina_detect: true
            });
        });
    </script>
</body>
</html>
