<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Property Rental Marketplace</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            background-color: var(--bg-dark);
            color: #ffffff;
        }

        .auth-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5) !important;
            border-radius: 20px;
        }

        .unique-role-selector {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .unique-role-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px 5px;
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-check:checked + .unique-role-item {
            background: rgba(6, 182, 212, 0.1);
            border-color: var(--primary-color);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
            transform: translateY(-3px);
        }

        .btn-check:checked + .unique-role-item span.material-symbols-outlined,
        .btn-check:checked + .unique-role-item .role-text {
            color: var(--primary-color);
            font-weight: bold;
        }

        .unique-role-item:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
            color: #ffffff;
        }

        .toggle-password {
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #adb5bd;
            border-left: none;
            transition: all 0.3s ease;
        }
        
        .input-group:focus-within .toggle-password {
            border-color: var(--primary-color);
            color: var(--primary-color);
        }
        
        .toggle-password:hover {
            color: var(--primary-color);
        }
        
        .form-check-input {
            background-color: var(--bg-dark);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        
        .auth-link {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .auth-link:hover {
            color: #ffffff;
        }
    </style>
</head>

<body>
    <!-- Animated Background Image -->
    <div class="position-fixed top-0 start-0 w-100 h-100 bg-image-zoom pointer-none" style="background: url('assets/images/hero_1_1786345494128.jpg') no-repeat center center; background-size: cover; z-index: -3;"></div>
    <!-- Premium Gradient Overlay -->
    <div class="position-fixed top-0 start-0 w-100 h-100 pointer-none" style="background: linear-gradient(135deg, rgba(2, 6, 23, 0.9) 0%, rgba(15, 23, 42, 0.8) 100%); backdrop-filter: blur(8px); z-index: -2;"></div>
    <!-- Particles Container -->
    <div id="tsparticles"></div>

    <div class="container position-relative z-1 py-3">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">
                <div class="auth-card p-4 p-lg-5 hover-elevate transition-all" data-aos="zoom-in">
                    
                    <div class="text-center mb-5">
                        <a href="index.html" class="small auth-link mb-3 d-inline-block"><i class="fas fa-arrow-left me-2"></i> Return to Home</a>
                        <h2 class="display-6 fw-bold mb-2 text-white">Welcome Back</h2>
                        <p class="text-light opacity-75">Sign in to your Stackly account to continue.</p>
                    </div>

                    <form id="loginForm">
                        <label class="form-label text-light opacity-75 small fw-bold letter-spacing-1 text-uppercase mb-3 d-block text-center">I am a...</label>
                        <div class="unique-role-selector mb-4">
                            <!-- Role 1: Tenant -->
                            <input type="radio" class="btn-check" name="loginRole" id="roleTenant" value="Tenant" checked autocomplete="off">
                            <label class="unique-role-item" for="roleTenant">
                                <span class="material-symbols-outlined fs-3 mb-1">vpn_key</span>
                                <span class="role-text small">Tenant</span>
                            </label>

                            <!-- Role 2: Landlord -->
                            <input type="radio" class="btn-check" name="loginRole" id="roleLandlord" value="Landlord" autocomplete="off">
                            <label class="unique-role-item" for="roleLandlord">
                                <span class="material-symbols-outlined fs-3 mb-1">real_estate_agent</span>
                                <span class="role-text small">Landlord</span>
                            </label>

                            <!-- Role 3: Admin -->
                            <input type="radio" class="btn-check" name="loginRole" id="roleAdmin" value="Admin" autocomplete="off">
                            <label class="unique-role-item" for="roleAdmin">
                                <span class="material-symbols-outlined fs-3 mb-1">admin_panel_settings</span>
                                <span class="role-text small">Admin</span>
                            </label>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label text-light opacity-75 small fw-bold letter-spacing-1 text-uppercase">Email Address</label>
                            <input class="form-control bg-dark border-secondary text-white py-3 shadow-none rounded-3" type="email" id="loginEmail" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-2 text-start">
                            <label class="form-label text-light opacity-75 small fw-bold letter-spacing-1 text-uppercase">Password</label>
                            <div class="input-group">
                                <input class="form-control bg-dark border-secondary border-end-0 text-white py-3 shadow-none rounded-start-3" type="password" id="loginPassword" placeholder="Enter password" minlength="8" required>
                                <button class="btn toggle-password rounded-end-3" type="button" style="padding-left: 15px; padding-right: 15px;">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Strength bar -->
                        <div class="mb-2" style="height:4px;border-radius:4px;background:rgba(255,255,255,0.1);overflow:hidden;">
                            <div id="strengthBar" style="height:100%;width:0;transition:width 0.3s, background 0.3s;"></div>
                        </div>
                        <div class="mb-4"></div>

                        <div class="d-flex justify-content-between align-items-center mb-5">
                            <div class="form-check text-start">
                                <input class="form-check-input shadow-none" type="checkbox" id="remember" required>
                                <label class="form-check-label text-light opacity-75 small fw-semibold" for="remember">Remember me</label>
                            </div>
                            <a href="#" class="small auth-link">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn btn-custom w-100 py-3 fw-bold mb-4 shadow-cyan hover-elevate d-flex align-items-center justify-content-center gap-2">
                            Sign In <i class="fa-solid fa-arrow-right-to-bracket ms-1"></i>
                        </button>

                        <p class="text-center mb-0 small text-light opacity-75">Don't have an account? <a href="signup.html" class="fw-bold auth-link ms-1">Register Now</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/auth.js"></script>
    <!-- tsParticles JS -->
    <script src="https://cdn.jsdelivr.net/npm/tsparticles-preset-stars@2/tsparticles.preset.stars.bundle.min.js"></script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Initialize tsParticles with stars preset
            tsParticles.load("tsparticles", {
                preset: "stars",
                background: {
                    color: {
                        value: "transparent"
                    }
                },
                particles: {
                    number: {
                        value: 100,
                        density: { enable: true, value_area: 800 }
                    },
                    color: { value: "#06b6d4" },
                    opacity: {
                        value: 0.5,
                        random: true,
                        anim: { enable: true, speed: 1, opacity_min: 0.1, sync: false }
                    },
                    size: {
                        value: 3,
                        random: true,
                        anim: { enable: true, speed: 2, size_min: 0.1, sync: false }
                    },
                    links: { enable: false },
                    move: {
                        enable: true,
                        speed: 0.5,
                        direction: "none",
                        random: true,
                        straight: false,
                        outModes: { default: "out" }
                    }
                },
                interactivity: {
                    detectsOn: "canvas",
                    events: {
                        onHover: { enable: true, mode: "bubble" },
                        resize: true
                    },
                    modes: {
                        bubble: { distance: 200, size: 6, duration: 2, opacity: 0.8 }
                    }
                },
                retina_detect: true
            });

            AOS.init({
                duration: 1000,
                once: true
            });
        });

        // Live password strength
        const pwdInput = document.getElementById('loginPassword');
        const bar = document.getElementById('strengthBar');
        const rules = {
            'r-len': v => v.length >= 8,
            'r-upper': v => /[A-Z]/.test(v),
            'r-num': v => /[0-9]/.test(v),
            'r-sym': v => /[^A-Za-z0-9]/.test(v)
        };
        const colors = ['#dc3545', '#fd7e14', '#ffc107', '#10b981']; // Red, Orange, Yellow, Emerald Green
        
        pwdInput.addEventListener('input', () => {
            const v = pwdInput.value;
            let passed = 0;
            Object.values(rules).forEach(fn => {
                if (fn(v)) passed++;
            });
            bar.style.width = (passed / 4 * 100) + '%';
            bar.style.background = colors[passed - 1] || 'rgba(255,255,255,0.1)';
        });
    </script>
</body>
</html>
